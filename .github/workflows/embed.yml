name: Re-embed RAG Corpus

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'showcase/**'
      - 'backend/scripts/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run embed script
        run: npx ts-node --project tsconfig.json scripts/embed.ts
        working-directory: backend

      - name: Commit updated embeddings.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/lambda/embeddings.json
          git diff --cached --quiet || git commit -m "chore: refresh rag corpus embeddings [skip ci]"
          git push
