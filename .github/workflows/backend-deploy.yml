name: Deploy RAG Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Lambda dependencies
        run: npm ci
        working-directory: backend/lambda

      - name: Compile Lambda TypeScript
        run: npx tsc handler.ts --module commonjs --target es2020 --esModuleInterop --resolveJsonModule --skipLibCheck --outDir .
        working-directory: backend/lambda

      - name: CDK Bootstrap (safe to run repeatedly)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap aws://${ACCOUNT_ID}/us-east-1
        working-directory: backend
        env:
          RAG_API_SECRET: ${{ secrets.RAG_API_SECRET }}

      - name: CDK Deploy
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json
        working-directory: backend
        env:
          RAG_API_SECRET: ${{ secrets.RAG_API_SECRET }}

      - name: Print API URL
        run: |
          echo "=== RAG API URL ==="
          cat backend/cdk-outputs.json
          echo "Add the ApiUrl value as RAG_API_URL GitHub secret."
